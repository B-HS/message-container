# 단일 컨테이너 구성: SQLite provider. DB 파일이 ./data 에 노출되어 호스트에서 직접 열람 가능
services:
    api:
        build:
            context: .
            dockerfile: apps/server/Dockerfile
        ports:
            - '${API_PORT:-33000}:33000'
        environment:
            DB_PROVIDER: sqlite
            SQLITE_PATH: /data/messages.db
            CHAT_DB_PATH: /host/messages/chat.db
            ATTACHMENTS_ROOT: /host/messages/Attachments
            SYNC_INTERVAL_MS: '${SYNC_INTERVAL_MS:-5000}'
            SYNC_BATCH_SIZE: '${SYNC_BATCH_SIZE:-1000}'
        volumes:
            - ${HOME}/Library/Messages:/host/messages:ro
            - ./data:/data
        restart: unless-stopped

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        ports:
            - '${WEB_PORT:-32000}:32000'
        environment:
            MESSAGE_API_URL: http://api:33000
            MESSAGE_API_PUBLIC_PORT: '${API_PORT:-33000}'
        depends_on:
            - api
        restart: unless-stopped
